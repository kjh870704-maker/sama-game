name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 단위 테스트
        run: npm test

      - name: 스테이지·외전 맵 데이터 검증
        run: npm run validate:stages

      - name: 웹 빌드
        run: npm run build

      # AI 클리어율 0%인 스테이지를 난이도 회귀로 간주해 차단한다 (PRD R6)
      - name: 밸런스 회귀 검출
        run: npm run sim -- "" 100
